name: Build
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Package name of the game:"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17
        cache: gradle

    - name: Check input
      if: ${{ github.event.inputs.package_name == '' }}
      run: |
        echo "::error::package_name is required!"
        exit 1

    - name: Print environment
      run: |
        java -version
        echo "Package: ${{ github.event.inputs.package_name }}"
        ls -l module.gradle module/src/main/cpp/game.h
        cat gradle/wrapper/gradle-wrapper.properties

    - name: Build
      run: |
        chmod +x ./gradlew
        sed -i 's/moduleDescription = "/moduleDescription = "(${{ github.event.inputs.package_name }}) /g' module.gradle
        sed -i "s/com.game.packagename/${{ github.event.inputs.package_name }}/g" module/src/main/cpp/game.h
        ./gradlew :module:assembleRelease --stacktrace --info

    - uses: actions/upload-artifact@v4
      with:
        name: zygisk-il2cppdumper
        path: out/magisk_module_release/
        if-no-files-found: warn
